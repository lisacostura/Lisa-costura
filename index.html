    <a href="#inscripcion">📝 Inscribirme</a>

  <!-- FORMULARIO -->
  <section class="inscripcion" id="inscripcion">
    <h2>🧵 Formulario de Inscripción</h2>

    <form id="formInscripcion">

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" required>

      <label for="telefono">Teléfono (WhatsApp)</label>
      <input type="tel" id="telefono" required>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" required>

      <label for="dni">DNI</label>
      <input type="text" id="dni" required>

      <label for="experiencia">Nivel de experiencia</label>
      <select id="experiencia" required>
        <option value="">Seleccionar</option>
        <option>Nunca cosí</option>
        <option>Básico</option>
        <option>Intermedio</option>
      </select>

      <label for="maquina">¿Cuenta con máquina de coser propia?</label>
      <select id="maquina" required>
        <option value="">Seleccionar</option>
        <option>Sí</option>
        <option>No</option>
      </select>

      <label for="tipoMaquina">Tipo de máquina</label>
      <select id="tipoMaquina">
        <option value="">Seleccionar</option>
        <option>Familiar</option>
        <option>Industrial</option>
      </select>

      <label for="curso">Curso y horario</label>
      <select id="curso" required>
        <option value="">Seleccionar</option>
        <option>Lunes – Deco hogar 9 a 11.30</option>
        <option>Lunes – Corte y confección 18 a 21</option>
        <option>Martes – Corte y confección 9 a 12</option>
        <option>Martes – Deco hogar 18 a 20.30</option>
        <option>Miércoles – Marroquinería 9 a 11.30</option>
        <option>Miércoles – Costura avanzada libre 15 a 17.30</option>
        <option>Miércoles – Corte y confección 18 a 21</option>
        <option>Jueves – Corte y confección 9 a 12</option>
        <option>Jueves – Marroquinería 18 a 20.30</option>
        <option>Viernes – Tejido 8 a 10</option>
        <option>Viernes – Costura niños y adolescentes 18 a 20</option>
        <option>Viernes – Amigurumi 18 a 20</option>
      </select>

      <div class="checks">
        
        <label>
          <input type="checkbox" required>
          Autorizo el uso de imágenes
        </label>

        <label>
          <input type="checkbox" required>
          Acepto la política de protección de datos
        </label>
      </div>

      <button type="button" onclick="enviarWhatsApp()">
        Enviar inscripción
      </button>

    </form>
  </section>
